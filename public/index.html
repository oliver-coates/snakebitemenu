<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnakeBite – Menu</title>
  <meta name="description" content="SnakeBite Cafe, Restaurant & Tap Bar – breakfast, dinner and drinks menus in your language.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/roboto-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/roboto-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img class="logo" src="assets/logo.png" width="565" height="173" alt="SnakeBite">
      <label class="lang-picker">
        <span class="visually-hidden" data-ui="language">Language</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-9 9h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        <select id="lang-select"></select>
      </label>
    </div>
  </header>

  <div class="sticky">
    <nav class="tabs" id="menu-tabs" role="tablist" aria-label="Menus"></nav>
    <nav class="cats" id="cat-nav" aria-label="Jump to section"></nav>
  </div>

  <main id="menu" class="menu" aria-live="polite">
    <noscript><p class="message">Please enable JavaScript to view the menu, or ask our staff for a printed copy.</p></noscript>
  </main>

  <footer class="site-footer" id="footer"></footer>
</body>
</html>
